spring.application.name=tienda_cerca

spring.datasource.url=jdbc:postgresql://localhost:5432/tienda_cerca
spring.datasource.username=${PG_USUARIO:postgres}
spring.datasource.password=${PG_CLAVE:tu_clave}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

app.mysql.url=jdbc:mysql://localhost:3307/tienda_cerca_chat?createDatabaseIfNotExist=true&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true&useSSL=false
app.mysql.username=${MYSQL_USUARIO:root}
app.mysql.password=${MYSQL_CLAVE:tu_clave}

jwt.secret=${JWT_SECRETO:MiTiendaCerca-USCO-ProgramacionWeb-2026-ClaveSecretaParaFirmarLosTokensJWT-HS512}
jwt.expiration=28800000

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:pon-aqui-tu-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:pon-aqui-tu-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

app.front=${APP_FRONT:http://localhost:4200,https://localhost:4200}

app.recurrentes.cron=0 0 7 * * *

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

spring.jackson.time-zone=America/Bogota

app.ia.gemini-key=${GEMINI_API_KEY:}
app.ia.modelo=gemini-2.5-flash

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.imagenes.carpeta=${IMAGENES_CARPETA:imagenes}
