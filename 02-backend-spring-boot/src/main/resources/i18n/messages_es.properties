inicio.p2=¿Cómo funciona el fiado?
inicio.r2=El tendero te asigna un cupo. Cuando pides fiado, el valor se suma a tu saldo y lo puedes consultar en "Mi fiado".
inicio.p3=¿Puedo pedir por voz?
inicio.r3=Sí. Toca el micrófono, di tu pedido y el asistente lo convierte en un carrito que puedes revisar antes de pagar.
inicio.p4=¿Y si el asistente no me entiende?
inicio.r4=Te comunica con una persona de la tienda en el mismo chat.
inicio.contTitulo=¿Tienes una tienda?
inicio.contTexto=Déjanos tus datos y te ayudamos a vender a domicilio.
