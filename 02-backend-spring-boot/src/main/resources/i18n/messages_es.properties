inicio.benCliente.1=Pide sin saber usar aplicaciones complicadas.
inicio.benCliente.2=Consulta tu fiado cuando quieras, sin discusiones.
inicio.benCliente.3=Programa el mercado que pides cada semana.
inicio.benCliente.4=Letra grande, alto contraste y pedido por voz.
inicio.benTendero.1=Pedidos ordenados, sin perder mensajes de WhatsApp.
inicio.benTendero.2=Adiós al cuaderno: el fiado se lleva solo.
inicio.benTendero.3=Rutas agrupadas por barrio para ahorrar domicilios.
inicio.benTendero.4=Reportes de ventas y alertas de productos por agotarse.
