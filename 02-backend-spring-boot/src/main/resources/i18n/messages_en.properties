inicio.p1=How much is delivery?
inicio.r1=$ 2,000, and free on orders from $ 40,000.
inicio.p2=How does the tab work?
inicio.r2=The owner gives you a limit. When you buy on your tab, the amount is added to your balance and you can check it in "My tab".
inicio.p3=Can I order by voice?
inicio.r3=Yes. Tap the microphone, say your order and the assistant turns it into a cart you can review before paying.
inicio.p4=What if the assistant doesn't understand me?
inicio.r4=It connects you with a person from the store in the same chat.
