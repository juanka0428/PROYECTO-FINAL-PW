inicio.nosTitulo=From the farm to your store
inicio.nosTexto1=Agropita was born in the Tatacoa desert, in Villavieja (Huila), where the sun and warm weather grow herbs like basil with lots of aroma and flavor.
inicio.nosTexto2=With this platform we bring that same care to neighborhood stores: fresh products, easy orders and on-time deliveries.
inicio.nosFoto2=Team packing basil
inicio.menuPedir=Place an order
inicio.heroEtiqueta=Built for neighborhood stores
inicio.heroTitulo=The corner store, now on your phone
inicio.heroTexto=Order with a voice note or a photo of your list, pay however you like — even on your tab — and see on the map when your delivery arrives.
