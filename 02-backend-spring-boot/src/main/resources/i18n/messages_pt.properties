inicio.benCliente.3=Programe as compras que você pede toda semana.
inicio.benCliente.4=Letra grande, alto contraste e pedido por voz.
inicio.benTendero.1=Pedidos organizados, sem perder mensagens do WhatsApp.
inicio.benTendero.2=Adeus caderno: o fiado se controla sozinho.
inicio.benTendero.3=Rotas agrupadas por bairro para economizar entregas.
inicio.benTendero.4=Relatórios de vendas e alertas de produtos acabando.
inicio.faqTitulo=Perguntas frequentes
inicio.p1=Quanto custa a entrega?
inicio.r1=$ 2.000, e é grátis em pedidos a partir de $ 40.000.
inicio.p2=Como funciona o fiado?
inicio.r2=O lojista te dá um limite. Quando você compra no fiado, o valor é somado ao seu saldo e você pode consultá-lo em "Minha conta fiado".
inicio.p3=Posso pedir por voz?
inicio.r3=Sim. Toque no microfone, diga seu pedido e o assistente o transforma em um carrinho que você revisa antes de pagar.
inicio.p4=E se o assistente não me entender?
inicio.r4=Ele te passa para uma pessoa da loja no mesmo chat.
inicio.contTitulo=Você tem uma loja?
inicio.contTexto=Deixe seus dados e ajudamos você a vender com entrega.
